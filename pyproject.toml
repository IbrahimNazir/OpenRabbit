[project]
name = "openrabbit"
version = "0.1.0"
description = "AI-powered GitHub PR reviewer — self-hosted, open-source"
requires-python = ">=3.12,<4"
readme = "README.md"
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.30,<0.31",
    "celery[redis]>=5.4,<6",
    "redis>=5.0,<6",
    "sqlalchemy[asyncio]>=2.0,<3",
    "asyncpg>=0.29,<0.30",
    "psycopg2-binary>=2.9,<3",
    "alembic>=1.13,<2",
    "anthropic>=0.40,<0.41",
    "google-genai>=1.0,<2",
    "PyGithub>=2.4,<3",
    "httpx>=0.27,<0.28",
    "openai>=1.6,<2",
    "groq>=1.0,<2",
    "pydantic-settings>=2.5,<3",
    "python-multipart>=0.0.12,<0.0.13",
    "python-jose[cryptography]>=3.3,<4",
    "structlog>=24.4,<25",
    "tree-sitter>=0.23,<0.24",
    "tree-sitter-python>=0.23,<0.24",
    "tree-sitter-javascript>=0.23,<0.24",
    "tree-sitter-typescript>=0.23,<0.24",
    "tree-sitter-go>=0.23,<0.24",
    "tree-sitter-rust>=0.23,<0.24",
    "tree-sitter-java>=0.23,<0.24",
    "tiktoken>=0.7,<0.8",
    "qdrant-client>=1.10,<2",
    "tenacity>=8.0,<10",
    "unicorn>=2.1.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<0.25",
    "pytest-mock>=3.14,<4",
    "ruff>=0.7,<0.8",
    "mypy>=1.11,<2",
    "black>=24.10,<25",
]

[tool.uv]
default-groups = "all"

[tool.uv.build-backend]
module-name = ["app"]
module-root = ""

[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
